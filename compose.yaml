# Docker Compose settings: how to start Airwave Archive.
# Start it with:  docker compose up -d --build
services:
  airwave:
    build: .
    container_name: airwave-archive
    restart: unless-stopped
    ports:
      # "host port:container port". Open http://<server>:8000 in a browser.
      - "8000:8000"
    environment:
      AIRWAVE_LIBRARY: /library
      AIRWAVE_DATA: /data
      AIRWAVE_INBOX: /inbox
    volumes:
      # Your recordings folder. It's writable so that files you approve in
      # the inbox can be added to it, and recordings you choose to delete
      # (after a confirmation page) can be removed. The app never changes
      # or renames the recordings already there. (Keep backups.)
      # Change the left side if your recordings live somewhere other than
      # /srv/airwave/library.
      - /srv/airwave/library:/library
      # The app's own data (its database). This one is writable, and is
      # the folder to back up: it will hold all your edits.
      - /srv/airwave/data:/data
      # The inbox: uploads wait here until you add them to the library
      # or reject them.
      - /srv/airwave/inbox:/inbox

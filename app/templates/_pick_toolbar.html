{# Tick episodes in the table below, then pick what to do with them from the
   "With ticked" menu (edit, export, mark played or not, delete). The tick
   boxes belong to this form (form="pick"), wherever they are on the page.
   Needs `back`: the page to return to afterwards. #}
<form id="pick" class="pick-toolbar" method="get" action="/episodes/edit">
  <input type="hidden" name="back" value="{{ back }}">
  <details class="drop">
    <summary class="button"><span aria-hidden="true">☰</span>With ticked</summary>
    <div class="drop-list">
      <button type="submit">Edit ticked…</button>
      <button type="submit" formaction="/export">Export ticked…</button>
      <button type="submit" formmethod="post" formaction="/episodes/played"
              name="played" value="1">Mark played</button>
      <button type="submit" formmethod="post" formaction="/episodes/played"
              name="played" value="0">Mark not played</button>
      <button type="submit" formaction="/feeds/new">Make a feed…</button>
      <button type="submit" formaction="/feeds/add">Add to a feed…</button>
      <button class="danger" type="submit" formaction="/delete">Delete ticked…</button>
    </div>
  </details>
  <span class="muted small" data-picked-count></span>
</form>

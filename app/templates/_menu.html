{# The menu in the top bar. Sent with every page (see _partial.html), so the
   current section stays highlighted as you move around. #}
{% set here = request.url.path %}
<nav id="menu" class="menu"{% if oob %} hx-swap-oob="true"{% endif %}>
  <a href="/"{% if here == "/" or here.startswith("/files") or here.startswith("/review") %} aria-current="page"{% endif %}>Library</a>
  <a href="/series"{% if here.startswith("/series") %} aria-current="page"{% endif %}>Series</a>
</nav>
